---
layout: default
---
<header class="page-header">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  {% include nav.html %}
</header>
<main class="wrap page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.intro %}<p class="intro">{{ page.intro }}</p>{% endif %}
  {{ content }}
</main>
