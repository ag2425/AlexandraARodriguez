{%- if include.image -%}
<img class="thumb{% if include.fit == 'contain' %} thumb--contain{% elsif include.fit == 'fill' %} thumb--fill{% endif %}" src="{{ include.image | relative_url }}"{% if include.position %} style="object-position:{{ include.position | escape }}"{% endif %} alt="" loading="lazy" decoding="async" width="84" height="84">
{%- else -%}
<div class="thumb ph ph-{{ include.tint | default: 'pink' }}"></div>
{%- endif -%}
